<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Hotel Reservas</title>
    <link rel="stylesheet" href="css/base.css">
</head>
<body>
    <header class="encabezado">
        <a href="index.html" class="logo">Hotel Reservas</a>
        <nav id="menu"></nav>
    </header>

    <main class="contenedor">
        <section class="tarjeta tarjeta-angosta">
            <h1>Iniciar sesión</h1>

            <form id="form-login" class="formulario">
                <p id="mensaje" class="mensaje" role="alert"></p>

                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn">Ingresar</button>
            </form>

            <p class="texto-secundario">¿No tenés cuenta? <a href="register.html">Registrate</a></p>
        </section>
    </main>

    <footer class="pie">
        <p>&copy; 2026 Hotel Reservas</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
