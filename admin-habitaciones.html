<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar habitaciones - Hotel Reservas</title>
    <link rel="stylesheet" href="css/base.css">
</head>
<body>
    <header class="encabezado">
        <a href="index.html" class="logo">Hotel Reservas</a>
        <nav id="menu"></nav>
    </header>

    <main class="contenedor">
        <h1>Administrar habitaciones</h1>
        <p id="mensaje" class="mensaje" role="alert"></p>

        <section class="tarjeta tarjeta-form">
            <h2 id="titulo-form">Nueva habitación</h2>

            <form id="form-habitacion" class="formulario">
                <div class="campo">
                    <label for="tipo">Tipo</label>
                    <input type="text" id="tipo" name="tipo" required>
                </div>

                <div class="campo">
                    <label for="precio">Precio por noche ($)</label>
                    <input type="number" id="precio" name="precio" min="1" required>
                </div>

                <div class="campo-check">
                    <input type="checkbox" id="disponible" name="disponible" checked>
                    <label for="disponible">Disponible</label>
                </div>

                <button type="submit" id="btn-guardar" class="btn">Agregar habitación</button>
                <button type="button" id="btn-cancelar-edicion" class="btn btn-secundario" hidden>Cancelar edición</button>
            </form>
        </section>

        <h2 class="seccion-titulo">Habitaciones cargadas</h2>
        <div class="tabla-contenedor">
            <table class="tabla">
                <thead>
                    <tr>
                        <th>Tipo</th>
                        <th>Precio por noche</th>
                        <th>Disponible</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-habitaciones"></tbody>
            </table>
        </div>
    </main>

    <footer class="pie">
        <p>&copy; 2026 Hotel Reservas</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/admin-habitaciones.js"></script>
</body>
</html>
