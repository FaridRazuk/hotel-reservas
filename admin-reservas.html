<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar reservas - Hotel Reservas</title>
    <link rel="stylesheet" href="css/base.css">
</head>
<body>
    <header class="encabezado">
        <a href="index.html" class="logo">Hotel Reservas</a>
        <nav id="menu"></nav>
    </header>

    <main class="contenedor">
        <h1>Administrar reservas</h1>
        <p id="mensaje" class="mensaje" role="alert"></p>

        <div class="filtros">
            <label for="filtro-estado">Filtrar por estado</label>
            <select id="filtro-estado">
                <option value="">Todos</option>
            </select>
        </div>

        <div class="tabla-contenedor">
            <table class="tabla">
                <thead>
                    <tr>
                        <th>Huésped</th>
                        <th>Habitación</th>
                        <th>Entrada</th>
                        <th>Salida</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tabla-reservas"></tbody>
            </table>
        </div>
    </main>

    <footer class="pie">
        <p>&copy; 2026 Hotel Reservas</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/admin-reservas.js"></script>
</body>
</html>
